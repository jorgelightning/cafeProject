name: Deploy site

# Publishes the site only after the tests pass. A red build used to go live anyway: on 13 Oct
# "App checks" failed while GitHub's own branch deploy succeeded.
#
# THIS DOES NOTHING UNTIL YOU TURN IT ON, so adding the file cannot break the live site:
#   1. Repo Settings > Pages > Build and deployment > Source: "GitHub Actions"
#   2. Repo Settings > Secrets and variables > Actions > Variables: PAGES_VIA_ACTIONS = true
# Do both. With step 1 alone nothing deploys; with step 2 alone this fails against the old setting.
#
# The daily backup bot pushes with GITHUB_TOKEN, and pushes made that way do not start other
# workflows, so this also runs when "Backup cafes data" finishes. Without that, the refreshed
# cafes.json would never publish.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Backup cafes data"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    if: ${{ vars.PAGES_VIA_ACTIONS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: "Assemble the site (only the app's files, no tests, notes or tooling)"
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.json cafes.json icon-180.png icon-192.png icon-512.png js styles.css _site/
          [ -d vendor ] && cp -r vendor _site/ || true
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
