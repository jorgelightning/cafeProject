name: Backup cafes data

# Snapshots the Firebase Realtime Database into cafes.json daily, on the `data` branch: a commit there on each day
# something changed is the backup, and its cafes.json is the one the site publishes (deploy.yml runs when this
# succeeds, takes the file from there and makes a share page per public cafe from it). Until 27 Oct this committed
# to main, where 45 bot commits sat among the real ones and twice turned a push away because the night's backup had
# landed first. main keeps a cafes.json of its own, no longer refreshed: the data for local runs and the tests.

on:
  schedule:
    - cron: "17 9 * * *" # daily ~09:17 UTC (odd minute avoids the on-the-hour rush)
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Switch to the data branch
        run: |
          if git fetch --depth=1 origin data; then
            git switch -C data FETCH_HEAD
          else
            # the first run: a branch of its own, with none of main's history, holding only the backup
            git switch --orphan data
          fi

      - name: Fetch data from Firebase
        run: |
          # Private spots are redacted on the way out, mirroring redactPrivate() in js/core.js.
          # The app already blurs them before writing, so this is the second line: a precise
          # value that reached Firebase before that existed — or by any other route — still
          # never lands in the published file. Coordinates round to ~1km; an area field with
          # digits in it is a street address, not a locality, and is dropped.
          # scripts/build-site.js checks the same again before the deploy publishes it.
          curl -fsS "https://cafeproject-b604f-default-rtdb.firebaseio.com/cafes.json" \
            | jq 'if type=="object" then [.[]] else . end
                  | map(if .custom == true then
                          .lat   = (if .lat == null then null else ((.lat * 100) | round) / 100 end)
                        | .lng   = (if .lng == null then null else ((.lng * 100) | round) / 100 end)
                        | .area  = (if ((.area // "") | test("[0-9]")) then "" else (.area // "") end)
                        | del(.pid)
                        else . end)' > cafes.json
          # Safety: never commit an empty/invalid snapshot over a good backup
          jq -e 'type=="array" and length>0' cafes.json > /dev/null
          # ...and never commit one that still carries a private address
          jq -e 'all(.[] | select(.custom == true);
                      ((.lat == null) or (.lat == ((.lat * 100 | round) / 100)))
                      and ((.lng == null) or (.lng == ((.lng * 100 | round) / 100)))
                      and ((.area // "") | test("[0-9]") | not)
                      and (has("pid") | not))' cafes.json > /dev/null

      - name: Commit if changed
        run: |
          git add cafes.json
          if git rev-parse -q --verify HEAD > /dev/null && git diff --cached --quiet; then
            echo "No changes since last backup."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898270+github-actions[bot]@users.noreply.github.com"
          git commit -m "Backup cafes.json ($(date -u +%Y-%m-%d))"
          git push origin data
